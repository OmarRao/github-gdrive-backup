<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <rect x="0" y="0" width="900" height="440" fill="#f1f5f9"/>
  <text x="32" y="42" font-size="18" font-weight="800" fill="#0f172a">Trust &amp; Distribution</text>
  <text x="32" y="64" font-size="13" fill="#64748b">Signed backups, verified restores, tamper-evident audit — packaged as a GitHub Action &amp; container image.</text>

  <!-- Signed manifest -->
  <rect x="32" y="88" width="270" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="52" y="118" font-size="22">🔏</text>
  <text x="86" y="115" font-size="14" font-weight="700" fill="#0f172a">Signed manifests</text>
  <text x="52" y="146" font-size="11.5" fill="#64748b">Ed25519 signature over manifest.json</text>
  <text x="52" y="164" font-size="11.5" fill="#64748b">detects forgery, not just corruption.</text>
  <rect x="52" y="180" width="230" height="24" rx="6" fill="#f0fdf4" stroke="#10b981"/>
  <circle cx="66" cy="192" r="4" fill="#10b981"/>
  <text x="78" y="196" font-size="11" font-weight="600" fill="#166534">Signature verified ✓  key a1b2c3d4</text>
  <text x="52" y="224" font-size="10.5" fill="#94a3b8">BACKUP_SIGNING_KEY · verified on restore</text>

  <!-- Recovery scorecard -->
  <rect x="315" y="88" width="270" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="335" y="118" font-size="22">🩺</text>
  <text x="369" y="115" font-size="14" font-weight="700" fill="#0f172a">Recovery scorecard</text>
  <text x="335" y="146" font-size="11.5" fill="#64748b">Monthly restore drill publishes proof</text>
  <text x="335" y="164" font-size="11.5" fill="#64748b">of recoverability + RTO.</text>
  <rect x="335" y="180" width="140" height="26" rx="13" fill="#0f172a"/>
  <text x="349" y="197" font-size="10.5" fill="#94a3b8">restore verified</text>
  <rect x="475" y="180" width="90" height="26" rx="13" fill="#16a34a"/>
  <text x="520" y="197" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">4m 12s</text>
  <text x="335" y="224" font-size="10.5" fill="#94a3b8">docs/recovery-scorecard.json → README badge</text>

  <!-- Tamper-evident audit -->
  <rect x="598" y="88" width="270" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="618" y="118" font-size="22">⛓️</text>
  <text x="652" y="115" font-size="14" font-weight="700" fill="#0f172a">Hash-chained audit</text>
  <text x="618" y="146" font-size="11.5" fill="#64748b">Each entry carries the prior entry's</text>
  <text x="618" y="164" font-size="11.5" fill="#64748b">hash — editing history is detectable.</text>
  <g font-family="ui-monospace, monospace" font-size="9" fill="#475569">
    <rect x="618" y="176" width="230" height="16" rx="3" fill="#f8fafc" stroke="#e2e8f0"/><text x="624" y="187">{ event:backup, prev:0000… }</text>
    <rect x="618" y="196" width="230" height="16" rx="3" fill="#f8fafc" stroke="#e2e8f0"/><text x="624" y="207">{ event:restore, prev:9f3a… }</text>
    <rect x="618" y="216" width="230" height="16" rx="3" fill="#f8fafc" stroke="#e2e8f0"/><text x="624" y="227">{ event:cleanup, prev:c1d8… }</text>
  </g>

  <!-- Distribution: Action + image -->
  <rect x="32" y="256" width="836" height="152" rx="12" fill="#0f172a"/>
  <text x="52" y="286" font-size="14" font-weight="700" fill="#ffffff">One-line adoption</text>
  <text x="52" y="308" font-size="11.5" fill="#94a3b8">GitHub Action (Marketplace) — drop into any workflow:</text>
  <rect x="52" y="318" width="500" height="74" rx="8" fill="#020617" stroke="#334155"/>
  <g font-family="ui-monospace, monospace" font-size="11" fill="#e2e8f0">
    <text x="66" y="338">- uses: OmarRao/github-gdrive-backup@v5</text>
    <text x="66" y="356" fill="#7dd3fc">  with:</text>
    <text x="66" y="372">    github-token: ${{ secrets.GH_TOKEN }}</text>
    <text x="66" y="388">    gdrive-folder-id: ${{ secrets.FOLDER }}</text>
  </g>
  <text x="576" y="308" font-size="11.5" fill="#94a3b8">Container image (GHCR):</text>
  <rect x="576" y="318" width="272" height="40" rx="8" fill="#020617" stroke="#334155"/>
  <text x="590" y="343" font-family="ui-monospace, monospace" font-size="10.5" fill="#4ade80">docker run ghcr.io/omarrao/</text>
  <text x="590" y="356" font-family="ui-monospace, monospace" font-size="10.5" fill="#4ade80">  github-gdrive-backup:v5</text>
  <text x="576" y="384" font-size="10.5" fill="#94a3b8">Published with SBOM + signed provenance.</text>
</svg>
